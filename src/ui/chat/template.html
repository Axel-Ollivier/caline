<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'nonce-{{NONCE}}'; script-src 'nonce-{{NONCE}}';">
  <style nonce="{{NONCE}}">
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: var(--vscode-editor-font-size, 13px);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
    }

    #header {
      padding: 8px 12px;
      background: var(--vscode-sideBar-background);
      border-bottom: 1px solid var(--vscode-panel-border);
      font-weight: bold;
      flex-shrink: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 4px 12px;
    }

    .msg {
      padding: 1px 0;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .msg.system {
      color: var(--vscode-descriptionForeground);
      font-style: italic;
    }

    #input-bar {
      padding: 8px 12px;
      border-top: 1px solid var(--vscode-panel-border);
      flex-shrink: 0;
    }

    #input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      background: var(--vscode-input-background);
      color: var(--vscode-input-foreground);
      border: 1px solid var(--vscode-input-border, transparent);
      border-radius: 4px;
      outline: none;
      font-family: inherit;
      font-size: inherit;
      resize: none;
      overflow-y: auto;
      max-height: 150px;
      line-height: 1.4;
    }

    #input:focus {
      border-color: var(--vscode-focusBorder);
    }
  </style>
</head>

<body>
  <div id="header">{{HEADER}}</div>
  <div id="messages"></div>
  <div id="input-bar">
    <textarea id="input" placeholder="Type a message..." rows="1"></textarea>
  </div>

  <script nonce="{{NONCE}}">
    (function () {
      const vscode = acquireVsCodeApi();
      const messagesEl = document.getElementById('messages');
      const inputEl = /** @type {HTMLTextAreaElement} */ (document.getElementById('input'));

      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && inputEl.value.trim()) {
          e.preventDefault();
          vscode.postMessage({ type: 'sendMessage', text: inputEl.value });
          inputEl.value = '';
          inputEl.style.height = 'auto';
        }
      });

      inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = inputEl.scrollHeight + 'px';
      });

      /** @type {Record<string, (msg: any) => void>} */
      const handlers = {
        addMessage(msg) {
          appendMessage(msg.text, msg.cssClass);
        },
        setMessages(msg) {
          messagesEl.innerHTML = '';
          for (const m of msg.messages) {
            appendMessage(m.text, m.cssClass, false);
          }
          scrollToBottom();
        },
        focusInput() {
          inputEl.focus();
        },
      };

      window.addEventListener('message', (event) => {
        const handler = handlers[event.data.type];
        if (handler) {
          handler(event.data);
        }
      });

      /**
       * @param {string} text
       * @param {string} [cssClass]
       * @param {boolean} [scroll]
       */
      function appendMessage(text, cssClass, scroll = true) {
        const div = document.createElement('div');
        div.className = cssClass ? `msg ${cssClass}` : 'msg';
        div.textContent = text;
        messagesEl.appendChild(div);
        if (scroll) {
          scrollToBottom();
        }
      }

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }


      inputEl.focus();
      vscode.postMessage({ type: 'ready' });
    })();
  </script>
</body>

</html>
